---
- name: Backup — Proxmox Backup Server e tarefas de vzdump
  hosts: proxmox
  become: true
  gather_facts: true

  tasks:
    - name: Cliente do PBS instalado
      ansible.builtin.apt:
        name: proxmox-backup-client
        state: present
        update_cache: true
      tags: [pbs]

    - name: Politica de retencao em vigor
      ansible.builtin.debug:
        msg: >-
          diarios {{ backup_retention.keep_daily }},
          semanais {{ backup_retention.keep_weekly }},
          mensais {{ backup_retention.keep_monthly }}
      tags: [vzdump]

    - name: Tarefas de vzdump
      ansible.builtin.debug:
        msg: "{{ item.comment }} - vmid {{ item.vmid }} as {{ item.schedule }}"
      loop: "{{ backup_jobs }}"
      loop_control:
        label: "{{ item.vmid }}"
      tags: [vzdump]

    - name: Lembrete que este playbook nao substitui
      ansible.builtin.debug:
        msg: >-
          Um backup por restaurar nao e um backup. O restauro trimestral esta
          em docs/runbooks/03-backup-e-restauro.md, seccao 4.

- name: Backup — o proprio Proxmox Backup Server
  hosts: backup
  become: true
  gather_facts: true

  tasks:
    - name: Proxmox Backup Server no contentor
      ansible.builtin.debug:
        msg: >-
          Por implementar: instalar proxmox-backup-server e criar o datastore
          {{ pbs_datastore }} em /datastore, o volume no disco externo.
          Ver tofu/envs/lab/pbs.tf.
      tags: [pbs]
