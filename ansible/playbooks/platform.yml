---
- name: Servicos de plataforma (LXC)
  hosts: platform
  become: true
  gather_facts: true

  roles:
    - role: common
      tags: [common]

  tasks:
    - name: Kafka em modo KRaft
      ansible.builtin.debug:
        msg: >-
          Por implementar: instalar Kafka, gerar o cluster-id KRaft e
          configurar os listeners. Ver docs/roadmap.md, Fase 2.
      when: inventory_hostname == 'kafka'
      tags: [kafka]

    - name: PostgreSQL 16
      ansible.builtin.debug:
        msg: >-
          Por implementar: instalar o PostgreSQL, afinar shared_buffers para
          4 GB de RAM e criar as bases de desenvolvimento.
      when: inventory_hostname == 'postgres'
      tags: [postgres]

    - name: Registry OCI
      ansible.builtin.debug:
        msg: >-
          Por implementar: correr registry:2 em Podman com armazenamento em
          /var/lib/registry e TLS emitido pelo cert-manager do cluster.
      when: inventory_hostname == 'registry'
      tags: [registry]
