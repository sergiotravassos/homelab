# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Configura o comportamento do Ansible: onde procurar coisas e como ligar.
#  PORQUE EXISTE  Sem isto teria de passar meia dúzia de opções em cada comando, e o CI
#                 usaria valores diferentes dos teus.
#  SE TIRARES     O Ansible não encontra o inventário nem os papéis, e falha logo.
#  ONDE APRENDER  docs/percurso.md — etapa 3
# ──────────────────────────────────────────────────────────────────────────────
#
#  A linha que causou um bug real: os caminhos aqui são relativos. O
#  ansible-playbook resolve-os contra a pasta onde corres o comando, o
#  ansible-lint contra a pasta deste ficheiro. Eram sítios diferentes e o CI
#  falhava. Solução: o Makefile entra sempre em ansible/ primeiro.
#
#  pipelining = True: menos ligações SSH por tarefa. Acelera muito.

[defaults]
inventory            = inventories/lab
roles_path           = roles:~/.ansible/roles
collections_path     = collections:~/.ansible/collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 10
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = .ansible/fact_cache
fact_caching_timeout  = 3600
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
