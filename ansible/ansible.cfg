# Os caminhos abaixo sao relativos a esta pasta. O Makefile entra em ansible/
# antes de correr qualquer coisa, para que o CWD e este ficheiro coincidam —
# o ansible-playbook resolve pelo CWD e o ansible-lint pelo config.
[defaults]
inventory            = inventories/lab
roles_path           = roles:~/.ansible/roles
collections_path     = collections:~/.ansible/collections
host_key_checking    = False
retry_files_enabled  = False
stdout_callback      = yaml
callbacks_enabled    = profile_tasks, timer
interpreter_python   = auto_silent
forks                = 10
gathering             = smart
fact_caching          = jsonfile
fact_caching_connection = .ansible/fact_cache
fact_caching_timeout  = 3600
display_skipped_hosts = False

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=300s -o PreferredAuthentications=publickey

[privilege_escalation]
become        = True
become_method = sudo
