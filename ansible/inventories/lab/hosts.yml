---
# Inventario do laboratorio. Um so ambiente — sem sufixos de ambiente nos nomes.
#
# Os enderecos abaixo sao os do modo "vlan" (fase 2). Em modo "flat" vem por
# DHCP e este ficheiro e sobreposto por inventories/lab/hosts-flat.yml.
# Ver docs/adr/0005-vlans-com-switch-gerivel.md

all:
  children:

    proxmox:
      hosts:
        forge:
          ansible_host: 10.10.10.10
          ansible_user: root

    platform:
      hosts:
        kafka:
          ansible_host: 10.10.20.21
        postgres:
          ansible_host: 10.10.20.22
        registry:
          ansible_host: 10.10.20.23

    workstation:
      hosts:
        devbox:
          ansible_host: 10.10.50.50

    network:
      hosts:
        opnsense-lab:
          ansible_host: 10.10.10.1
          ansible_user: root
          ansible_python_interpreter: /usr/local/bin/python3.11

    # Guests que NAO sao geridos por Ansible, aqui so para memoria futura:
    #   haos     — appliance fechada, configurada pelo add-on de Git do proprio HA
    #   bazzite  — imagem bootc, alterada por rebase e nao por configuracao
    #   ocp-sno  — RHCOS, gerido por Ignition e depois por GitOps
