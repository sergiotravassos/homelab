---
# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Lista que máquinas existem e como se agrupam.
#  PORQUE EXISTE  Um playbook não diz "corre no 10.10.20.21" — diz "corre no grupo
#                 platform". Este ficheiro é o que traduz um pelo outro.
#  SE TIRARES     O Ansible não sabe a quem se dirigir.
#  ONDE APRENDER  docs/percurso.md — etapa 3
# ──────────────────────────────────────────────────────────────────────────────
#
#  Os grupos (proxmox, platform, workstation, network) são o que os playbooks
#  usam em `hosts:`. Três guests não estão aqui de propósito — o comentário
#  abaixo explica quais e porquê.

all:
  children:

    proxmox:
      hosts:
        forge:
          ansible_host: 10.10.10.10
          ansible_user: root

    platform:
      hosts:
        kafka:
          ansible_host: 10.10.20.21
        postgres:
          ansible_host: 10.10.20.22
        registry:
          ansible_host: 10.10.20.23

    workstation:
      hosts:
        devbox:
          ansible_host: 10.10.50.50

    network:
      hosts:
        opnsense-lab:
          ansible_host: 10.10.10.1
          ansible_user: root
          ansible_python_interpreter: /usr/local/bin/python3.11
