---
# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Liga a GPU ao driver vfio-pci, para poder ser entregue a uma VM.
#  PORQUE EXISTE  O host reclama a placa no arranque se ninguém a tirar primeiro. Este papel
#                 é o que a tira.
#  SE TIRARES     A bazzite arranca com ecrã preto e sem pista nenhuma do motivo.
#  ONDE APRENDER  docs/percurso.md — etapa 5
# ──────────────────────────────────────────────────────────────────────────────
#
#  O papel mais interessante do repo para aprender Ansible, por duas razões:
#
#  1. VERIFICA antes de mexer. Confirma que o IOMMU está activo e falha se não
#     estiver, em vez de escrever configuração que não vai funcionar.
#
#  2. NÃO INVENTA valores. Se vfio_device_ids estiver vazio, não escreve nada e
#     diz-te como apurar os IDs. Um endereço PCI errado aqui é um dia perdido.

- name: Sem dispositivos declarados — nada a fazer
  ansible.builtin.debug:
    msg: >-
      vfio_device_ids esta vazio. Apurar com 'lspci -nn | grep -i -e VGA -e Audio'
      e preencher em inventories/lab/group_vars/proxmox.yml.
  when: vfio_device_ids | length == 0

- name: Configurar o vfio-pci
  when: vfio_device_ids | length > 0
  block:

    - name: Confirmar que o IOMMU esta activo
      ansible.builtin.command: dmesg
      register: vfio_dmesg
      changed_when: false
      failed_when: >-
        'AMD-Vi' not in vfio_dmesg.stdout and 'IOMMU enabled' not in vfio_dmesg.stdout

    - name: Confirmar que cada dispositivo esta isolado no seu grupo IOMMU
      ansible.builtin.shell: >-
        set -o pipefail;
        for g in /sys/kernel/iommu_groups/*/devices/*; do
          echo "${g%/devices/*}|${g##*/}"
        done
      args:
        executable: /bin/bash
      register: vfio_iommu_groups
      changed_when: false

    - name: Modulos vfio carregados no arranque
      ansible.builtin.copy:
        dest: /etc/modules-load.d/vfio.conf
        mode: "0644"
        content: |
          vfio
          vfio_iommu_type1
          vfio_pci
      notify: Regenerar initramfs

    - name: Ligar os dispositivos ao vfio-pci
      ansible.builtin.copy:
        dest: /etc/modprobe.d/vfio.conf
        mode: "0644"
        content: |
          # Gerido por Ansible — ver docs/gpu-passthrough.md
          options vfio-pci ids={{ vfio_device_ids | join(',') }} disable_vga=1
      notify: Regenerar initramfs

    - name: Impedir que o host reclame a placa
      ansible.builtin.copy:
        dest: /etc/modprobe.d/blacklist-gpu.conf
        mode: "0644"
        content: |
          # Gerido por Ansible
          {% for m in vfio_blacklist_modules %}
          blacklist {{ m }}
          {% endfor %}
      notify: Regenerar initramfs
