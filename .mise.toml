# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Fixa a versão de cada ferramenta do posto de trabalho.
#  PORQUE EXISTE  Sem isto, a tua máquina e o CI usam versões diferentes e um erro aparece
#                 num sítio e não no outro. `mise install` instala tudo de uma vez.
#  SE TIRARES     Instalas tudo à mão com brew, e as versões passam a divergir com o tempo.
#  ONDE APRENDER  docs/percurso.md — etapa 2
# ──────────────────────────────────────────────────────────────────────────────
#
#  O mise é um gestor de versões de ferramentas — como o nvm ou o sdkman, mas
#  para tudo. Corre `mise install` uma vez e ficas com estas versões exactas.

[tools]
opentofu   = "1.10.6"
terraform-docs = "0.20.0"
tflint     = "0.58.1"
packer     = "1.14.2"
kubectl    = "1.32.5"
helm       = "3.17.3"
sops       = "3.10.2"
age        = "1.2.1"
yq         = "4.45.1"
jq         = "1.7.1"
pre-commit = "4.2.0"
python     = "3.12"

[tools.pipx]
ansible-core = "2.18.6"
ansible-lint = "25.4.0"
yamllint     = "1.37.1"

# oc e openshift-install nao estao no registo do mise; instalados por scripts/install-oc.sh
# a versao alvo do cluster vive em openshift/install/VERSION

[env]
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
TF_IN_AUTOMATION = "1"
