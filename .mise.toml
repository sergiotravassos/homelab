# Toolchain do posto de trabalho. Uma versao, a mesma no Mac e no CI.
#   mise install
[tools]
opentofu   = "1.10.6"
terraform-docs = "0.20.0"
tflint     = "0.58.1"
packer     = "1.14.2"
kubectl    = "1.32.5"
helm       = "3.17.3"
sops       = "3.10.2"
age        = "1.2.1"
yq         = "4.45.1"
jq         = "1.7.1"
pre-commit = "4.2.0"
python     = "3.12"

[tools.pipx]
ansible-core = "2.18.6"
ansible-lint = "25.4.0"
yamllint     = "1.37.1"

# oc e openshift-install nao estao no registo do mise; instalados por scripts/install-oc.sh
# a versao alvo do cluster vive em openshift/install/VERSION

[env]
ANSIBLE_CONFIG = "{{config_root}}/ansible/ansible.cfg"
TF_IN_AUTOMATION = "1"
