---
name: bootc

# Constroi as imagens das VMs atomicas e publica-as em ghcr.io.
# As VMs adoptam-nas com 'bootc switch' e recebem actualizacoes automaticas.
# Ver bootc/README.md

on:
  push:
    branches: [main]
    paths:
      - "bootc/**"
      - ".github/workflows/bootc-images.yml"
  schedule:
    # semanal: apanha actualizacoes de seguranca das imagens base
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: homelab-devbox
            context: bootc/devbox
          - name: homelab-bazzite
            context: bootc/bazzite

    steps:
      - uses: actions/checkout@v4

      - name: libertar espaco
        # as imagens bootc sao grandes; o runner por omissao nao chega
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android
          df -h /

      - name: construir
        id: build
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ matrix.image.name }}
          tags: latest ${{ github.sha }}
          context: ${{ matrix.image.context }}
          containerfiles: ${{ matrix.image.context }}/Containerfile
          oci: true

      - name: publicar
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
          registry: ghcr.io/${{ github.repository_owner }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
