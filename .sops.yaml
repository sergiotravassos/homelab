---
# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Diz que ficheiros são cifrados e com que chave.
#  PORQUE EXISTE  O repositório é público. Sem cifra, qualquer segredo aqui é comprometido
#                 em minutos por robôs automáticos. Não é hipótese, é certeza.
#  SE TIRARES     Nada é cifrado automaticamente e depende de te lembrares. Não vai acontecer.
#  ONDE APRENDER  docs/percurso.md — etapa 9
# ──────────────────────────────────────────────────────────────────────────────
#
#  O SOPS cifra VALOR a VALOR, não o ficheiro inteiro. Consequência prática:
#  continuas a ver num `git diff` que uma chave mudou, sem ver o conteúdo.
#
#  A chave privada vive em ~/.config/sops/age/keys.txt e NUNCA entra no Git.
#  Perdê-la significa perder todos os segredos cifrados. Faz cópia offline.

creation_rules:
  - path_regex: \.sops\.(yaml|yml|json|env)$
    age: &lab_key "age1PREENCHER_COM_A_CHAVE_PUBLICA_REAL"

  - path_regex: ^ansible/inventories/.*/group_vars/.*/vault\.ya?ml$
    age: *lab_key

  - path_regex: ^openshift/gitops/.*/secrets?/.*\.ya?ml$
    age: *lab_key
    encrypted_regex: "^(data|stringData)$"
