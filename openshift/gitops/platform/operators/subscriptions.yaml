---
# Operadores da plataforma. Todos do catalogo, nenhum instalado a martelo.
#
# O canal esta fixado de proposito: 'stable' muda debaixo dos pes e um lab que
# se actualiza sozinho e um lab que se avaria sozinho.

apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: strimzi-kafka-operator
  namespace: platform-kafka
spec:
  channel: stable
  installPlanApproval: Manual
  name: strimzi-kafka-operator
  source: community-operators
  sourceNamespace: openshift-marketplace

