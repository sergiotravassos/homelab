---
# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Divide a plataforma em duas ondas: primeiro os operadores, depois o que criam.
#  PORQUE EXISTE  Um operador instala CRDs — tipos novos de recurso. Um Kafka não pode ser
#                 criado antes de o CRD Kafka existir.
#  SE TIRARES     O primeiro sync falha sempre que o cluster é reconstruído, porque tenta
#                 criar um Kafka antes de o Strimzi existir.
#  ONDE APRENDER  docs/percurso.md — etapa 7
# ──────────────────────────────────────────────────────────────────────────────
#
#  `argocd.argoproj.io/sync-wave` é a anotação que ordena. Menor primeiro:
#    -1  operadores (instalam os CRDs)
#     0  instâncias (usam os CRDs)
#     1  observabilidade
#     2  aplicações
#
#  O Argo CD só passa à onda seguinte quando a anterior está saudável.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-operators
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/sergiotravassos/homelab.git
    targetRevision: main
    path: openshift/gitops/platform/operators
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true

---
# Instancias geridas pelos operadores acima. Wave 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-instances
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/sergiotravassos/homelab.git
    targetRevision: main
    path: openshift/gitops/platform/instances
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 10
      backoff: { duration: 20s, factor: 2, maxDuration: 10m }
