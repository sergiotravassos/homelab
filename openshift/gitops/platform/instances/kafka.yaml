---
# Cluster Kafka de um broker, modo KRaft, sem ZooKeeper.
#
# Replica 1 e uma escolha consciente: para praticar operacao, rebalanceamento e
# falha de consumidor chega. Nao substitui um cluster de tres nos, e o repo
# assume-o em vez de fingir. Ver docs/diagrams/06-platform.svg

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    deleteClaim: false

---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: lab
  namespace: platform-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # replica 1: nao ha para onde replicar num no so
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
    resources:
      requests: { memory: 1Gi, cpu: "500m" }
      limits: { memory: 2Gi, cpu: "2" }

  entityOperator:
    topicOperator: {}
    userOperator: {}

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders.events
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000      # 7 dias
    cleanup.policy: delete

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: inventory.events
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
