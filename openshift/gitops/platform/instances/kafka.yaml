---
# ─── Cartão de leitura ────────────────────────────────────────────────────────
#  O QUE FAZ      Declara o cluster Kafka e os tópicos, através do operador Strimzi.
#  PORQUE EXISTE  Mostra o modelo de operador na prática: descreves um Kafka em YAML e o
#                 operador cria os pods, os discos e a configuração por ti.
#  SE TIRARES     Não há Kafka no cluster. Os LXC de plataforma continuam a servir.
#  ONDE APRENDER  docs/percurso.md — etapa 8
# ──────────────────────────────────────────────────────────────────────────────
#
#  Repara em `replicas: 1` e nos factores de replicação a 1. Num nó só não há
#  para onde replicar. Está assumido em vez de disfarçado — é honesto, e não
#  substitui um cluster de três nós.
#
#  KRaft: modo sem ZooKeeper. É o presente do Kafka; o ZooKeeper foi removido.

apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: combined
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  replicas: 1
  roles:
    - controller
    - broker
  storage:
    type: persistent-claim
    size: 20Gi
    deleteClaim: false

---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: lab
  namespace: platform-kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.9.0
    metadataVersion: 3.9-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      # replica 1: nao ha para onde replicar num no so
      offsets.topic.replication.factor: 1
      transaction.state.log.replication.factor: 1
      transaction.state.log.min.isr: 1
      default.replication.factor: 1
      min.insync.replicas: 1
      auto.create.topics.enable: false
    resources:
      requests: { memory: 1Gi, cpu: "500m" }
      limits: { memory: 2Gi, cpu: "2" }

  entityOperator:
    topicOperator: {}
    userOperator: {}

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders.events
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  partitions: 3
  replicas: 1
  config:
    retention.ms: 604800000      # 7 dias
    cleanup.policy: delete

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: inventory.events
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: lab
spec:
  partitions: 3
  replicas: 1
  config:
    cleanup.policy: compact
