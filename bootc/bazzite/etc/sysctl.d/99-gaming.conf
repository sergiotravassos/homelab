# Afinacoes para uma VM com GPU em passthrough.
#
# split_lock_mitigate=0: sem isto, jogos que usam split locks levam uma
# penalizacao grande dentro de KVM. Num guest dedicado o risco e aceitavel.
kernel.split_lock_mitigate = 0

# Muitos jogos modernos (e o Proton) esgotam o default.
vm.max_map_count = 2147483642

# Latencia sobre throughput — e uma consola, nao um servidor.
vm.swappiness = 10
